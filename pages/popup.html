<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueueTTS</title>
    <link rel="stylesheet" href="../styles/ui.css" />
    <link rel="stylesheet" href="../styles/surfaces.css" />
  </head>
  <body class="popup">
    <header class="top">
      <img class="mark" src="../assets/icons/mark.svg" alt="" width="20" height="20" />
      <span class="brand">QueueTTS</span>
      <button class="icon-btn" id="openPanel" type="button" aria-label="Open the queue in the side panel" title="Open queue"></button>
      <button class="icon-btn" id="openSettings" type="button" aria-label="Settings" title="Settings"></button>
    </header>
    <main>
      <div class="banner" id="health" hidden></div>
      <section class="np" id="player" aria-label="Now playing" hidden></section>
      <section class="intro" id="intro" hidden>
        <h1>Listen to articles later</h1>
        <p>Add pages or selected text. QueueTTS reads them to you in order and remembers where you stopped.</p>
      </section>
      <section class="page" id="page" aria-label="This page" aria-busy="true">
        <div class="page-row">
          <span class="page-fav"></span>
          <div class="page-text">
            <p class="page-title" id="pageTitle">Checking this page…</p>
            <p class="meta" id="pageMeta"></p>
          </div>
        </div>
        <div class="page-actions" id="pageActions"></div>
      </section>
      <section class="paste" id="paste" hidden aria-label="Paste text">
        <label class="sr-only" for="pasteText">Text to add</label>
        <textarea class="textarea" id="pasteText" rows="5" placeholder="Paste text to listen to"></textarea>
        <div class="paste-actions">
          <span class="meta" id="pasteCount"></span>
          <button class="btn btn-quiet" id="pasteCancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="pasteAdd" type="button" disabled>Add to queue</button>
        </div>
      </section>
      <section class="next" id="next" aria-labelledby="nextTitle" hidden>
        <div class="sec-head"><h3 id="nextTitle">Up next</h3><span class="meta" id="nextTotal"></span></div>
        <ol class="rows" id="nextList"></ol>
        <button class="btn btn-quiet more" id="more" type="button" hidden></button>
      </section>
      <section class="done-state" id="caughtUp" hidden>
        <p><strong>You’re all caught up.</strong> Add another page to keep listening.</p>
      </section>
    </main>
    <footer class="foot">
      <button class="btn btn-quiet" id="pasteToggle" type="button"></button>
      <span class="meta" id="shortcutHint"></span>
    </footer>
    <script type="module" src="../src/ui/popup.js"></script>
  </body>
</html>
