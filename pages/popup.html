<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueueTTS</title>
    <link rel="stylesheet" href="../styles/ui.css" />
    <link rel="stylesheet" href="../styles/workspace.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <img class="mark" src="../assets/icons/mark.svg" alt="" width="18" height="18" />
      <span class="brand">QueueTTS</span>
      <button class="icon-btn" id="openPanel" type="button" aria-label="Open the queue in the side panel" title="Open the side panel"></button>
      <button class="icon-btn" id="openSettings" type="button" aria-label="Settings" title="Settings"></button>
    </header>
    <div class="banner" id="health" hidden></div>
    <section class="deck" id="deck" aria-label="Now listening" hidden></section>
    <section class="welcome-deck" id="welcome" hidden aria-labelledby="welcomeTitle">
      <div class="lines" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="welcomeTitle">Save it now. Hear it later.</h1>
      <p>Add articles as you find them. QueueTTS reads them aloud in order and remembers where you stopped.</p>
    </section>
    <section class="here" id="here" aria-label="This page" aria-busy="true">
      <div class="here-row">
        <span id="hereFav"></span>
        <div>
          <p class="here-title" id="hereTitle">Checking this page…</p>
          <p class="here-meta" id="hereMeta"></p>
        </div>
      </div>
      <div class="here-actions" id="hereActions"></div>
    </section>
    <section class="paste" id="paste" hidden aria-label="Paste text">
      <label class="sr-only" for="pasteText">Text to add</label>
      <textarea class="textarea" id="pasteText" rows="5" placeholder="Paste text to listen to"></textarea>
      <div class="paste-actions">
        <span class="meta" id="pasteCount"></span>
        <button class="btn btn-quiet" id="pasteCancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="pasteAdd" type="button" disabled>Add to queue</button>
      </div>
    </section>
    <section class="lane" id="next" hidden aria-labelledby="nextTitle">
      <div class="lane-head"><h2 id="nextTitle">Up next</h2><span class="meta" id="nextMeta"></span><button class="btn btn-quiet" id="more" type="button" hidden></button></div>
      <ol class="queue rail" id="nextList"></ol>
    </section>
    <p class="lane-empty" id="caughtUp" hidden></p>
    <footer class="foot">
      <button class="btn btn-quiet" id="pasteToggle" type="button" aria-expanded="false"></button>
      <span class="meta" id="shortcutHint"></span>
    </footer>
    <script type="module" src="../src/ui/popup.js"></script>
  </body>
</html>
